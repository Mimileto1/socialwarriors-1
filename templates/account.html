<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ 'Crear cuenta' if mode == 'register' else 'Iniciar sesión' }} · {{ title }}</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font:16px system-ui,sans-serif;background:var(--back);color:var(--text)}
.wars{--back:repeating-linear-gradient(135deg,#1f251c 0 5px,#252d21 5px 10px);--paper:#303a2b;--text:#fbf7db;--accent:#e8cf55;--line:#a79d58;--ink:#232309}
.empires{--back:radial-gradient(ellipse at top,#75472b,#251712 75%);--paper:#f3e1b9;--text:#422618;--accent:#713a21;--line:#a17544;--ink:#fff3dc}
.city{--back:linear-gradient(155deg,#9ddcf8,#1e6395);--paper:#f4fbff;--text:#15314b;--accent:#075e95;--line:#4594be;--ink:#fff}
main{width:min(100%,420px);padding:clamp(20px,6vw,36px);background:var(--paper);border:2px solid var(--line);border-radius:12px;box-shadow:0 14px 40px #0004}
.brand{display:block;max-width:85%;max-height:110px;object-fit:contain;margin:0 auto 20px}
h1{text-align:center;margin:0 0 12px;font-size:2rem}.empires h1,.empires h2{font-family:Georgia,serif}.wars h1{letter-spacing:.05em;text-transform:uppercase}
h2{font-size:1.3rem;margin:0 0 16px}
label{display:grid;gap:5px;margin:14px 0}
input,select,button{font:inherit;border-radius:5px;padding:10px;border:1px solid var(--line)}
input,select{background:#fff;color:#172a36;width:100%}
button{background:var(--accent);color:var(--ink);font-weight:700;cursor:pointer;width:100%}
:focus-visible{outline:3px solid var(--line);outline-offset:3px}
a{color:inherit} [role=alert]{border-left:4px solid var(--accent);padding-left:10px;font-weight:600}
</style>
</head>
<body class="{{ theme }}">
<main>
  {% if theme != 'city' %}<img class="brand" src="/img/logo.png" alt="">{% endif %}
  <h1>{{ title }}</h1>
  <h2>{{ 'Crear cuenta' if mode == 'register' else 'Iniciar sesión' }}</h2>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('account_register' if mode == 'register' else 'account_login') }}">
    <input type="hidden" name="csrf" value="{{ account_csrf() }}">
    <label>Usuario <input name="username" autocomplete="username" minlength="3" maxlength="32" required></label>
    <label>Contraseña <input name="password" type="password" autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}" maxlength="128" {% if mode == 'register' %}minlength="8"{% endif %} required></label>
    {% if mode == 'register' %}
    <label>Confirmar contraseña <input name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
    {% endif %}
    <button type="submit">{{ 'Crear cuenta' if mode == 'register' else 'Entrar al juego' }}</button>
  </form>
  <p><a href="{{ url_for('account_login' if mode == 'register' else 'account_register') }}">{{ 'Ya tengo una cuenta' if mode == 'register' else 'Crear una cuenta' }}</a></p>
</main>
</body>
</html>
