<aside class="game-community game-community-{{ community_theme }}" aria-label="Comunidad del juego">
  <nav aria-label="Comunidad">
    <button type="button" data-panel="chat" aria-expanded="false"><span aria-hidden="true">☵</span>Chat</button>
    <button type="button" data-panel="neighbors" aria-expanded="false"><span aria-hidden="true">♟</span>Vecinos</button>
    <button type="button" data-panel="invite" aria-expanded="false"><span aria-hidden="true">✉</span>Invitar</button>
    <button type="button" data-panel="alliance" aria-expanded="false"><span aria-hidden="true">⚑</span>Alianza</button>
    <button type="button" data-panel="events" aria-expanded="false"><span aria-hidden="true">✦</span>Eventos</button>
    <button type="button" data-panel="ranking" aria-expanded="false"><span aria-hidden="true">▥</span>Clasif.</button>
    <button type="button" data-panel="rewards" aria-expanded="false"><span aria-hidden="true">✿</span>Bonos</button>
    <button type="button" data-panel="profile" aria-expanded="false"><span aria-hidden="true">◉</span>Perfil</button>
    {% if community_is_admin() %}<a href="/admin"><span aria-hidden="true">⚙</span>Admin</a>{% endif %}
  </nav>
  <div class="community-drawer" id="community-drawer" role="region" aria-labelledby="community-heading" hidden>
    <header>
      <div><h2 id="community-heading"></h2><p class="community-connection" id="community-connection" role="status"></p></div>
      <button type="button" id="community-retry" hidden>Reintentar</button>
      <button type="button" id="community-close" aria-label="Cerrar panel">×</button>
    </header>
  <section data-view="chat" aria-label="Chat en vivo">
    <p id="community-room-row"><strong id="community-room">Sala global</strong> <button type="button" id="community-global" hidden>Volver al chat global</button></p>
    <ol id="community-messages" aria-label="Mensajes del chat"></ol>
    <form id="community-chat">
      <label for="community-message">Mensaje</label>
      <input id="community-message" name="message" maxlength="300" required>
      <button>Enviar</button>
    </form>
  </section>
  <section data-view="neighbors" aria-label="Vecinos" hidden>
    <ul id="community-friends"></ul>
  </section>
  <section data-view="invite" aria-label="Invitaciones" hidden>
    <div id="community-invite-link">
      <label for="community-link">Tu enlace de invitación</label>
      <div><input id="community-link" readonly><button type="button" id="community-copy">Copiar enlace</button></div>
    </div>
    <form id="community-search">
      <label for="community-query">Buscar jugador</label>
      <input id="community-query" name="q" minlength="2" maxlength="32" required>
      <button>Buscar</button>
    </form>
    <ul id="community-players" aria-label="Resultados de jugadores" aria-live="polite"></ul>
    <form id="community-invite">
      <label for="community-user">Nombre de usuario</label>
      <input id="community-user" name="username" maxlength="32" required>
      <button>Solicitar amistad</button>
    </form>
  </section>
  <section data-view="alliance" aria-label="Alianza" hidden>
    <form id="alliance-create"><label for="alliance-name">Nombre de la alianza</label>
      <input id="alliance-name" name="name" minlength="3" maxlength="36" required>
      <button>Crear alianza</button>
    </form>
    <form id="alliance-search"><label for="alliance-query">Buscar alianza</label>
      <input id="alliance-query" name="q" maxlength="36"><button>Buscar</button>
    </form>
    <form id="alliance-invite" hidden><label for="alliance-player">Invitar por nombre de usuario</label>
      <input id="alliance-player" name="username" minlength="3" maxlength="32" required>
      <button>Enviar invitación</button>
    </form>
    <div id="alliance-details"></div>
  </section>
  <section data-view="events" aria-label="Eventos" hidden><div id="community-events"></div></section>
  <section data-view="ranking" aria-label="Clasificación" hidden><p>Puntos de comunidad ganados</p><ol id="community-rankings"></ol></section>
  <section data-view="rewards" aria-label="Bonos y tienda" hidden>
    <p id="community-points"></p><div id="community-bonuses"></div>
    <form id="community-redeem"><label for="community-code">Código de recompensa</label>
      <input id="community-code" maxlength="24" required><button>Canjear</button>
    </form>
    <h3>Títulos para tu perfil</h3><div id="community-shop"></div>
  </section>
  <section data-view="profile" aria-label="Perfil" hidden><dl id="community-profile"></dl></section>
  <p id="community-status" role="status"></p>
  </div>
</aside>
<style>
.game-community {
  --panel:#18231c; --raised:#26392c; --line:#5c7651; --accent:#d9eca2;
  --ink:#f5f8ee; --muted:#bfcebe; --surface:#121d17; --accent-ink:#162411;
  position:fixed; z-index:6000; inset:clamp(4rem,12vh,8rem) auto auto 0;
  display:flex; align-items:flex-start; max-width:100%; isolation:isolate;
  font:14px/1.45 system-ui,sans-serif; color:var(--ink); text-align:left;
}
.game-community-empires {
  --panel:#261a24; --raised:#432a35; --line:#a07056; --accent:#ffd295;
  --ink:#fff2e5; --muted:#e3c5b9; --surface:#1b121a; --accent-ink:#321c24;
}
.game-community-city {
  --panel:#102639; --raised:#1b3a50; --line:#397e93; --accent:#9aeafb;
  --ink:#edf9ff; --muted:#bed7e4; --surface:#0b1d2d; --accent-ink:#102839;
}
.game-community *, .game-community *::before { box-sizing:border-box }
.game-community [hidden] { display:none!important }
.game-community nav {
  display:grid; gap:4px; width:4.75rem; max-height:80vh; overflow:auto; overscroll-behavior:contain;
  padding:6px 5px; background:linear-gradient(165deg,var(--raised),var(--panel) 36%);
  border:1px solid var(--line); border-left:0; border-radius:0 16px 16px 0;
  box-shadow:0 10px 28px #0007;
}
.game-community nav :is(button,a) {
  position:relative; display:grid; justify-items:center; gap:2px; min-height:2.65rem;
  text-decoration:none; font-size:.73rem; font-weight:650; line-height:1.15;
  color:var(--muted); padding:4px 1px; background:none; border:1px solid transparent; border-radius:8px;
}
.game-community nav span { color:var(--accent); font-size:1.16rem; line-height:1 }
.game-community nav :is(button,a):hover { color:var(--ink); background:var(--raised) }
.game-community nav [aria-expanded=true] { color:var(--accent); border-color:var(--line); background:var(--raised) }
.game-community nav [aria-expanded=true]::before {
  content:""; position:absolute; inset:7px auto 7px 0; width:3px;
  border-radius:1px 4px 4px 1px; background:var(--accent);
}
.community-drawer {
  margin-left:.5rem; width:min(25rem,calc(100vw - 5.6rem)); max-height:80vh; overflow:auto;
  background:var(--panel); border:1px solid var(--line); border-top:2px solid var(--accent);
  border-radius:14px; padding:0 16px 16px; box-shadow:0 16px 40px #0009; overscroll-behavior:contain;
}
.community-drawer header {
  position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between;
  gap:12px; margin:0 -16px 12px; padding:12px 16px; border-bottom:1px solid var(--line);
  background:linear-gradient(120deg,var(--raised),var(--panel));
}
.community-drawer h2 { font-size:1.17rem; line-height:1.25; margin:0; color:var(--ink) }
.community-drawer h3 { font-size:.94rem; color:var(--accent); margin:1.05em 0 .55em }
.community-connection { display:flex; align-items:center; gap:6px; margin:.25rem 0 0; font-size:.75rem; color:var(--muted) }
.community-connection::before { content:""; width:7px; height:7px; flex:0 0 7px; border-radius:50%; background:#e9b96d }
.community-connection[data-state="online"]::before { background:#a9e49a }
.community-connection[data-state="offline"]::before,.community-connection[data-state="expired"]::before { background:#f09894 }
.community-drawer header > button { min-width:36px; font-size:1.25rem; line-height:1 }
.game-community button {
  border:1px solid var(--line); cursor:pointer; color:var(--ink); font:inherit; font-weight:550;
  background:var(--raised); border-radius:7px; padding:6px 9px; line-height:1.2;
}
.game-community button:hover:enabled { border-color:var(--accent) }
.game-community button:disabled { color:var(--muted); cursor:default; opacity:.62 }
.game-community form > button:is(:not([type]),[type="submit"]) { background:var(--accent); color:var(--accent-ink) }
.game-community :focus-visible { outline:2px solid var(--accent); outline-offset:2px }
.game-community :is(ol,ul) { margin:0; padding:0; list-style:none; overflow-wrap:anywhere }
.game-community li { margin:6px 0; padding:7px 9px; background:var(--surface); border:1px solid transparent; border-radius:8px }
.game-community li button { margin:3px 2px 0 }
.game-community form { display:flex; align-items:end; gap:7px; flex-wrap:wrap; margin:10px 0 }
.game-community label { flex-basis:100%; color:var(--muted); font-size:.82rem; font-weight:650 }
.game-community input {
  box-sizing:border-box; min-width:0; min-height:35px; flex:1; background:var(--surface);
  color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 8px; font:inherit;
}
#community-invite-link { display:grid; gap:5px }
#community-invite-link > div { display:flex; gap:7px }
#community-room-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:5px; margin:0 0 9px }
#community-room { overflow-wrap:anywhere; color:var(--accent) }
#community-messages { max-height:min(43vh,19rem); min-height:3.2rem; overflow:auto; overscroll-behavior:contain }
#community-messages li { margin:0 0 5px }
#community-messages li[data-own] { background:var(--raised); border-color:var(--line) }
#community-messages li p { margin:1px 0 0; white-space:pre-wrap }
#community-messages .message-meta { display:flex; justify-content:space-between; gap:8px; color:var(--accent); font-size:.79rem }
#community-messages time { color:var(--muted); white-space:nowrap }
#community-status { padding:8px 9px; border-left:2px solid var(--accent); background:var(--surface); border-radius:5px; margin:10px 0 0 }
#community-status:empty { display:none }
#community-points { color:var(--accent); background:var(--surface); padding:10px; border:1px solid var(--line); border-radius:8px }
#community-profile { display:grid; grid-template-columns:auto 1fr; gap:8px 14px; margin:0; overflow-wrap:anywhere }
#community-profile dt { color:var(--muted) }
#community-profile dd { margin:0; font-weight:650 }
@media (max-width:600px) {
  .game-community { inset:auto 0 0; flex-direction:column-reverse; align-items:stretch; }
  .game-community nav {
    grid-auto-flow:column; grid-auto-columns:minmax(3.8rem,1fr); width:100%; max-height:none;
    overflow:auto; border:1px solid var(--line); border-bottom:0; border-radius:12px 12px 0 0;
    padding-bottom:max(6px,env(safe-area-inset-bottom));
  }
  .game-community nav :is(button,a) { min-height:41px; }
  .community-drawer { width:auto; margin:0 5px 6px; max-height:64vh; max-height:64dvh; }
  .game-community nav [aria-expanded=true]::before { inset:auto 8px 0; width:auto; height:2px }
}
</style>
<script>
(() => {
  const token = {{ account_csrf() | tojson }};
  const username = {{ community_username() | tojson }};
  const chatTime = new Intl.DateTimeFormat("es", {hour:"2-digit", minute:"2-digit"});
  const messages = document.querySelector("#community-messages");
  const friends = document.querySelector("#community-friends");
  const status = document.querySelector("#community-status");
  let peer = "";
  let inAllianceChat = false;
  let activeView = "";
  const drawer = document.querySelector("#community-drawer");
  const heading = document.querySelector("#community-heading");
  const views = {chat: "Chat", neighbors: "Vecinos", invite: "Invitaciones", alliance: "Alianza", events: "Eventos", ranking: "Clasificación", rewards: "Bonos y tienda", profile: "Perfil"};
  let activeButton;
  const panel = messages.closest("aside");
  const inviteForm = document.querySelector("#community-invite");
  const link = document.querySelector("#community-link");
  const room = document.querySelector("#community-room");
  const globalButton = document.querySelector("#community-global");
  const tabs = panel.querySelectorAll("[data-panel]");
  let lastChat = "";
  let lastFriends = "";
  let stopped = false;
  let pollTimer;
  let pollRequest;
  let pollKey = "";
  let pollTag = "";
  let failures = 0;
  let viewRevision = 0;
  let pendingChat;
  const connection = document.querySelector("#community-connection");
  const retry = document.querySelector("#community-retry");
  const connectionLabels = {
    connecting: "Conectando…", online: "Conectado",
    retrying: "Reconectando…", offline: "Sin conexión", expired: "Sesión vencida"
  };
  function connectionState(state) {
    if (connection.dataset.state === state) return;
    connection.dataset.state = state;
    connection.textContent = connectionLabels[state];
    retry.hidden = state !== "retrying";
  }

  async function api(path, fields, check = {}) {
    if (!navigator.onLine) {
      connectionState("offline");
      throw new Error("Estás sin conexión. Vuelve a intentarlo al recuperar la red.");
    }
    const controller = new AbortController();
    const cancel = () => controller.abort();
    if (check.signal?.aborted) cancel();
    check.signal?.addEventListener("abort", cancel, {once:true});
    const timeout = setTimeout(cancel, 10000);
    const headers = check.etag ? {"If-None-Match":check.etag} : {};
    const options = fields
      ? {method:"POST", body:new URLSearchParams({...fields, csrf:token}), headers}
      : {headers};
    try {
      const response = await fetch("/social/" + path, {...options, signal:controller.signal, cache:"no-store"});
      if (response.status === 401) {
        stopped = true;
        connectionState("expired");
        throw new Error("Inicia sesión de nuevo para usar la comunidad.");
      }
      if (response.status >= 500) {
        connectionState("retrying");
        throw new Error("La comunidad está tardando en responder. Inténtalo de nuevo.");
      }
      connectionState("online");
      if (response.status === 304 && check.conditional) return {etag:check.etag};
      if (response.status === 429) throw new Error("Espera unos segundos antes de volver a enviar.");
      const isJson = response.headers.get("Content-Type")?.includes("json");
      if (response.status === 403 && !isJson) throw new Error("Recarga la página y vuelve a intentar.");
      if (!isJson) throw new Error("No se pudo completar la consulta.");
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "La comunidad no está disponible.");
      return check.conditional ? {data, etag:response.headers.get("ETag") || ""} : data;
    } catch (error) {
      if (check.signal?.aborted) throw error;
      if (error.name === "AbortError" || error instanceof TypeError) {
        connectionState(navigator.onLine ? "retrying" : "offline");
        throw new Error("Se perdió la conexión. Inténtalo de nuevo.");
      }
      throw error;
    } finally {
      clearTimeout(timeout);
      check.signal?.removeEventListener("abort", cancel);
    }
  }
  async function activate(view) {
    const revision = ++viewRevision;
    activeView = view;
    if (view) connectionState(stopped ? "expired" : navigator.onLine ? "connecting" : "offline");
    refresh();
    drawer.hidden = !view;
    heading.textContent = views[view] || "";
    for (const tab of tabs) {
      tab.setAttribute("aria-expanded", String(tab.dataset.panel === view));
      tab.setAttribute("aria-controls", "community-drawer");
    }
    for (const section of panel.querySelectorAll("[data-view]")) section.hidden = section.dataset.view !== view;
    if (view === "invite") {
      try {
        const invitation = await api("invitation");
        if (revision === viewRevision) link.value = new URL(invitation.path, location.origin).href;
      }
      catch (error) { if (revision === viewRevision) status.textContent = error.message; }
    }
    try {
      if (view === "alliance") await loadAlliance();
      if (view === "events") await loadEvents();
      if (view === "ranking") await loadRanking();
      if (view === "rewards") await loadRewards();
      if (view === "profile") {
        const player = await api("profile");
        if (revision !== viewRevision) return;
        const fields = [["Usuario", player.username], ["Título", player.title || "Sin título"], ["Vecinos", player.neighbors], ["Alianza", player.alliance || "Sin alianza"]];
        const profile = document.querySelector("#community-profile");
        profile.replaceChildren(...fields.flatMap(([label, value]) => {
          const title = document.createElement("dt"), detail = document.createElement("dd");
          title.textContent = label;
          detail.textContent = value;
          return [title, detail];
        }));
      }
    } catch (error) { if (revision === viewRevision) status.textContent = error.message; }
  }
  let rankingEvent = "";
  const dateLabel = new Intl.DateTimeFormat("es-CO", {dateStyle:"medium", timeStyle:"short", timeZone:"America/Bogota"});
  function actionButton(label, action, disabled = false) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.disabled = disabled;
    button.addEventListener("click", async () => {
      button.disabled = true;
      try { await action(); } catch (error) { status.textContent = error.message; }
      finally { button.disabled = disabled; }
    });
    return button;
  }
  function labeledRow(parent, text, ...buttons) {
    const row = document.createElement("li");
    row.append(text, " ", ...buttons);
    parent.append(row);
  }
  async function reward(kind, reference, reload) {
    await api("rewards", {kind, reference});
    status.textContent = "Actualizado.";
    await reload();
  }
  async function loadEvents() {
    const state = await api("events");
    if (activeView !== "events") return;
    const list = document.createElement("ul");
    for (const e of state.events) {
      const entry = document.createElement("li");
      const title = document.createElement("strong");
      title.textContent = e.title;
      const description = document.createElement("p");
      description.textContent = e.description;
      const open = !e.closed && e.starts <= state.now && e.ends > state.now;
      const window = document.createElement("p");
      window.textContent = e.closed ? "Cerrado" : dateLabel.format(new Date(e.starts * 1000)) + " – " + dateLabel.format(new Date(e.ends * 1000));
      entry.append(title, description, window);
      if (open || e.claimed) entry.append(actionButton(
        e.claimed ? "Recompensa reclamada" : "Participar · " + e.points + " puntos",
        () => reward("event", e.id, loadEvents), Boolean(e.claimed)
      ));
      entry.append(actionButton("Participantes", async () => {
        rankingEvent = e.id;
        await activate("ranking");
      }));
      list.append(entry);
    }
    if (!state.events.length) labeledRow(list, "Aún no hay eventos publicados.");
    document.querySelector("#community-events").replaceChildren(list);
  }
  async function loadRanking() {
    const event = rankingEvent;
    const {players} = await api("rankings?event=" + encodeURIComponent(event));
    if (activeView !== "ranking" || event !== rankingEvent) return;
    const target = document.querySelector("#community-rankings");
    target.replaceChildren();
    players.forEach((p, index) => labeledRow(target, (index + 1) + ". " + p.username + " · " + p.score));
    if (!players.length) labeledRow(target, "Todavía no hay puntos registrados.");
    const title = target.previousElementSibling;
    title.replaceChildren(event ? "Participantes del evento " : "Puntos de comunidad ganados");
    if (event) title.append(actionButton("Ver clasificación general", async () => {
      rankingEvent = "";
      await loadRanking();
    }));
  }
  async function loadRewards() {
    const state = await api("rewards");
    if (activeView !== "rewards") return;
    document.querySelector("#community-points").textContent = "Saldo: " + state.points + " puntos de comunidad";
    const bonuses = document.createElement("ul");
    for (const b of state.bonuses) labeledRow(bonuses,
      (b.kind === "daily" ? "Bono diario" : "Bono semanal") + " · " + b.points + " puntos",
      actionButton(b.claimed ? "Reclamado" : "Reclamar", () => reward(b.kind, "", loadRewards), b.claimed)
    );
    document.querySelector("#community-bonuses").replaceChildren(bonuses);
    const shop = document.createElement("ul");
    for (const item of state.items) {
      const equipped = state.equipped === item.id;
      labeledRow(shop, item.title + (item.owned ? "" : " · " + item.cost + " puntos"),
        item.owned
          ? actionButton(equipped ? "Quitar título" : "Equipar", () => reward("equip", equipped ? "" : item.id, loadRewards))
          : actionButton("Comprar", () => reward("shop", item.id, loadRewards), state.points < item.cost)
      );
    }
    document.querySelector("#community-shop").replaceChildren(shop);
  }
  document.querySelector("#community-redeem").addEventListener("submit", async event => {
    event.preventDefault();
    const form = event.currentTarget;
    const code = document.querySelector("#community-code");
    const button = form.querySelector("button");
    button.disabled = true;
    try { await reward("code", code.value.trim(), loadRewards); form.reset(); }
    catch (error) { status.textContent = error.message; }
    finally { button.disabled = false; }
  });

  function chatPath() {
    if (inAllianceChat) return "alliance/chat";
    return peer ? "private/" + encodeURIComponent(peer) : "chat";
  }
  function switchRoom(next, alliance = false) {
    peer = alliance ? "" : next;
    inAllianceChat = alliance;
    room.textContent = alliance ? "Alianza · " + next : peer ? "Chat con " + peer : "Sala global";
    globalButton.hidden = !peer && !alliance;
    messages.replaceChildren();
    lastChat = "";
    pollTag = "";
    activate("chat");
  }
  tabs.forEach(tab => tab.addEventListener("click", () => {
    activeButton = tab;
    status.textContent = "";
    activate(activeView === tab.dataset.panel ? "" : tab.dataset.panel);
  }));
  function closeDrawer() {
    if (!activeView) return;
    activate("");
    activeButton?.focus();
  }
  document.querySelector("#community-close").addEventListener("click", closeDrawer);
  panel.addEventListener("keydown", event => { if (event.key === "Escape") closeDrawer(); });

  const allianceCreate = document.querySelector("#alliance-create");
  const allianceSearch = document.querySelector("#alliance-search");
  const allianceInvite = document.querySelector("#alliance-invite");
  const allianceDetails = document.querySelector("#alliance-details");
  let allianceQuery = "";
  async function allianceAction(action, fields = {}) {
    try {
      await api("alliance", {action, ...fields});
      status.textContent = "";
      if (action === "leave" && inAllianceChat) {
        inAllianceChat = false;
        room.textContent = "Sala global";
        globalButton.hidden = true;
        messages.replaceChildren();
        lastChat = "";
      }
      await loadAlliance();
    } catch (error) { status.textContent = error.message; }
  }
  async function loadAlliance() {
    const state = await api("alliance?q=" + encodeURIComponent(allianceQuery));
    if (activeView !== "alliance") return;
    allianceCreate.hidden = allianceSearch.hidden = Boolean(state.alliance);
    allianceInvite.hidden = state.alliance?.leader !== state.player;
    const actionButton = (label, action, fields) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.addEventListener("click", () => allianceAction(action, fields));
      return button;
    };
    const list = document.createElement("ul");
    function row(label, ...actions) {
      const li = document.createElement("li");
      li.append(label, ...actions);
      list.append(li);
    }
    if (state.alliance) {
      const {name, leader} = state.alliance;
      row(name + " · Líder: " + leader);
      const chat = document.createElement("button");
      chat.type = "button";
      chat.textContent = "Abrir chat de alianza";
      chat.addEventListener("click", () => switchRoom(name, true));
      row("", chat);
      for (const username of state.members) {
        const actions = leader === state.player && username !== leader
          ? [actionButton("Transferir liderazgo", "transfer", {username})] : [];
        row(username + " ", ...actions);
      }
      for (const username of state.pending) row(
        "Solicitud de " + username + " ", actionButton("Aceptar", "accept", {username}),
        actionButton("Rechazar", "reject", {username})
      );
      for (const username of state.outgoing) row(
        "Invitación enviada a " + username + " ", actionButton("Retirar", "revoke_invite", {username})
      );
      row("", actionButton(leader === state.player && state.members.length === 1 ? "Disolver alianza" : "Salir de la alianza", "leave"));
    } else {
      for (const {id, name} of state.invites) row(
        "Invitación de " + name + " ", actionButton("Aceptar", "join_invite", {alliance_id: id}),
        actionButton("Rechazar", "decline_invite", {alliance_id: id})
      );
      for (const {id, name, pending} of state.directory) row(name + " ", actionButton(
        pending ? "Cancelar solicitud" : "Solicitar ingreso", pending ? "cancel" : "request", {alliance_id: id}
      ));
      if (!state.directory.length) row("No hay alianzas que coincidan.");
    }
    allianceDetails.replaceChildren(list);
  }
  allianceCreate.addEventListener("submit", event => {
    event.preventDefault();
    allianceAction("create", {name: allianceCreate.elements.name.value});
  });
  allianceInvite.addEventListener("submit", event => {
    event.preventDefault();
    const form = event.currentTarget;
    allianceAction("invite", {username: form.elements.username.value});
  });
  allianceSearch.addEventListener("submit", async event => {
    event.preventDefault();
    allianceQuery = allianceSearch.elements.q.value;
    try { await loadAlliance(); } catch (error) { status.textContent = error.message; }
  });
  globalButton.addEventListener("click", () => switchRoom(""));
  document.querySelector("#community-copy").addEventListener("click", async () => {
    if (!link.value) return;
    try { await navigator.clipboard.writeText(link.value); status.textContent = "Enlace copiado."; }
    catch { link.select(); status.textContent = "Selecciona y copia el enlace."; }
  });
  const inviter = sessionStorage.getItem("community-inviter");
  if (inviter) {
    inviteForm.elements.username.value = inviter;
    sessionStorage.removeItem("community-inviter");
    activate("invite");
  }
  function renderChat(rows) {
    const signature = JSON.stringify(rows);
    if (signature === lastChat) return;
    lastChat = signature;
    const atEnd = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 30;
    const oldTop = messages.scrollTop;
    messages.replaceChildren(...rows.map(({author, body, created}) => {
      const item = document.createElement("li");
      if (author === username) item.dataset.own = "";
      const meta = document.createElement("div");
      meta.className = "message-meta";
      const name = document.createElement("strong");
      name.textContent = author === username ? "Tú" : author;
      const time = document.createElement("time");
      const timestamp = new Date(created);
      if (Number.isFinite(timestamp.getTime())) {
        time.dateTime = timestamp.toISOString();
        time.textContent = chatTime.format(timestamp);
      }
      meta.append(name, time);
      const text = document.createElement("p");
      text.textContent = body;
      item.append(meta, text);
      return item;
    }));
    if (!rows.length) messages.append(Object.assign(document.createElement("li"), {textContent:"Aún no hay mensajes en esta sala."}));
    messages.scrollTop = atEnd ? messages.scrollHeight : oldTop;
  }
  function renderFriends(rows) {
    const signature = JSON.stringify(rows);
    if (signature === lastFriends) return;
    lastFriends = signature;
    if (!rows.length) {
      friends.replaceChildren(Object.assign(document.createElement("li"), {textContent:"Aún no tienes vecinos. Puedes buscarlos en Invitar."}));
      return;
    }
    friends.replaceChildren(...rows.map(({username, status: state}) => {
      const item = document.createElement("li");
      item.append(username + (state === "outgoing" ? " · Enviada " : state === "incoming" ? " · Recibida " : " "));
      const actions = state === "incoming" ? [["accept", "Aceptar"], ["remove", "Rechazar"]] :
        [["remove", state === "outgoing" ? "Cancelar" : "Eliminar"]];
      if (state === "accepted") {
        const chat = document.createElement("button");
        chat.textContent = "Chat privado";
        chat.addEventListener("click", () => switchRoom(username));
        item.append(chat, " ");
      }
      for (const [action, label] of actions) {
        const button = document.createElement("button");
        button.textContent = label;
        button.addEventListener("click", () => submit("friends", {username, action}));
        item.append(button, " ");
      }
      return item;
    }));
  }
  function canPoll() {
    return !stopped && !document.hidden && navigator.onLine && ["chat", "neighbors"].includes(activeView);
  }
  function pausePolling() {
    clearTimeout(pollTimer);
    pollRequest?.abort();
    pollRequest = null;
  }
  function refresh() {
    pausePolling();
    if (canPoll()) pollTimer = setTimeout(poll, 0);
  }
  async function poll() {
    if (!canPoll()) return;
    const view = activeView;
    const key = view === "chat" ? chatPath() : "friends";
    if (key !== pollKey) {
      failures = 0;
      pollKey = key;
      pollTag = "";
    }
    const request = new AbortController();
    pollRequest = request;
    try {
      const result = await api(key, undefined, {conditional:true, etag:pollTag, signal:request.signal});
      if (pollRequest !== request) return;
      failures = 0;
      pollTag = result.etag;
      if (result.data) {
        if (view === "chat") renderChat(result.data.messages);
        else renderFriends(result.data.friends);
      }
    } catch (error) {
      if (pollRequest === request) {
        failures++;
        if (stopped || connection.dataset.state === "online") status.textContent = error.message;
      }
    } finally {
      if (pollRequest === request) {
        pollRequest = null;
        const base = view === "chat" ? 6000 : 16000;
        const delay = Math.min(60000, base * 2 ** Math.min(failures, 4));
        if (canPoll()) pollTimer = setTimeout(poll, delay + Math.random() * 600);
      }
    }
  }
  async function submit(path, fields, form) {
    const button = form?.querySelector("button");
    if (button?.disabled) return false;
    if (button) button.disabled = true;
    try {
      await api(path, fields);
      if (form && (!fields.message || form.elements.message.value === fields.message)) form.reset();
      status.textContent = "";
      refresh();
      return true;
    } catch (error) {
      status.textContent = error.message;
      return false;
    } finally {
      if (button) button.disabled = false;
    }
  }
  document.querySelector("#community-chat").addEventListener("submit", async event => {
    event.preventDefault();
    const form = event.currentTarget;
    if (form.querySelector("button").disabled) return;
    const text = form.elements.message.value;
    const room = chatPath();
    if (pendingChat?.text !== text || pendingChat.room !== room) {
      const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), n => n.toString(16).padStart(2, "0")).join("");
      pendingChat = {text, room, id};
    }
    if (await submit(room, {message:text, message_id:pendingChat.id}, form)) pendingChat = undefined;
  });
  document.querySelector("#community-search").addEventListener("submit", async event => {
    event.preventDefault();
    const form = event.currentTarget;
    const button = form.querySelector("button");
    const results = document.querySelector("#community-players");
    button.disabled = true;
    results.replaceChildren();
    status.textContent = "";
    try {
      const query = encodeURIComponent(form.elements.q.value);
      const {players} = await api("players?q=" + query);
      if (!players.length) status.textContent = "No se encontraron jugadores.";
      for (const username of players) {
        const item = document.createElement("li");
        const select = document.createElement("button");
        select.type = "button";
        select.textContent = "Seleccionar a " + username;
        select.addEventListener("click", () => {
          inviteForm.elements.username.value = username;
          inviteForm.querySelector("button").focus();
        });
        item.append(select);
        results.append(item);
      }
    } catch (error) {
      status.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });
  document.querySelector("#community-invite").addEventListener("submit", event => {
    event.preventDefault();
    submit("friends", {action: "request", username: event.currentTarget.elements.username.value}, event.currentTarget);
  });
  retry.addEventListener("click", () => activate(activeView));
  document.addEventListener("visibilitychange", refresh);
  window.addEventListener("offline", () => {
    pausePolling();
    if (!stopped) connectionState("offline");
  });
  window.addEventListener("online", () => {
    if (activeView && !stopped) {
      failures = 0;
      activate(activeView);
    }
  });
  refresh();
})();
</script>
